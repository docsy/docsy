# Build Docsy & the website and run all repo checks across OSs.

name: test

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

# run_id, not github.ref: main pushes and dispatches never share a group, so
# none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run install:safe

      - name: 'Sanity check: install left the working tree pristine'
        run: npm run -s is:clean

      # Twin of link-cache-refresh.yaml's checksum-verified install: keep the
      # pinned versions in step.
      - if: runner.os != 'Windows'
        name: Install lychee
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          tmp="$(mktemp -d)"
          curl -sfL "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$tmp"
          install -D "$(find "$tmp" -type f -name lychee | head -n1)" "$HOME/.local/bin/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - if: runner.os != 'Windows'
        run: npm run test:full

      - if: runner.os != 'Windows'
        name: Lychee sanity tests (offline)
        env: { LYCHEE_SANITY_NO_NET: 1 }
        run: npm run test:lychee

      - if: runner.os == 'Windows'
        run: |
          npm run _test:full:pre &&
          npm run -C docsy.dev build &&
          npm run _test:full:common

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-site-${{ matrix.os }}
          path: docsy.dev/public

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run install:safe

      - run: npm run install:browser

      - run: npm run test:visual

      # An in-workspace golden rewrite (e.g. by a smuggled lifecycle hook)
      # must be loud: the tree stays clean after the comparison.
      - run: npm run -s is:clean

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: tmp/visual/
