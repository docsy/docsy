# Build Docsy & the website and run all repo checks across OSs.

name: test

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run install:safe

      - name: 'Sanity check: install left the working tree pristine'
        run: npm run -s is:clean

      # Put lychee on PATH for the link checker (test:full runs on Linux only).
      # Twin of link-cache-refresh.yaml's checksum-verified install: keep the
      # pinned versions in step.
      - if: runner.os != 'Windows'
        name: Install lychee
        env:
          LYCHEE_VERSION: v0.24.2
        run: |
          tmp="$(mktemp -d)"
          curl -sfL "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$tmp"
          install -D "$(find "$tmp" -type f -name lychee | head -n1)" "$HOME/.local/bin/lychee"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - if: runner.os != 'Windows'
        run: npm run test:full

      # Offline lychee canaries; Linux-only, like test:full (no lychee on Windows).
      - if: runner.os != 'Windows'
        name: Lychee sanity tests (offline)
        env: { LYCHEE_SANITY_NO_NET: 1 }
        run: npm run test:lychee

      - if: runner.os == 'Windows'
        run: |
          npm run _test:full:pre &&
          npm run -C docsy.dev build &&
          npm run _test:full:common

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-site-${{ matrix.os }}
          path: docsy.dev/public

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run install:safe

      - run: npm run install:browser

      - run: npm run test:visual

      # An in-workspace golden rewrite (e.g. by a smuggled lifecycle hook)
      # must be loud: the tree stays clean after the comparison.
      - run: npm run -s is:clean

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diffs
          path: tmp/visual/
