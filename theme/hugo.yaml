params:
  time_format_blog: Monday, January 02, 2006
  time_format_default: January 2, 2006
  rss_sections: [blog]
  docsy:
    plugins:
      click-to-copy: { enable: true, defer: true }
      tabpane-persist: { enable: true }
      markmap: { enable: false, version: 0.18.12 }
  katex:
    version: 0.18.4
  mermaid:
    version: 11.17.2
  redoc:
    version: 2.5.3

outputFormats:
  LLMS:
    baseName: llms
    isPlainText: true
    mediaType: text/plain
    notAlternative: true
  print:
    baseName: index
    # FIXME: leave isHTML unset (i.e. false) until we get a Hugo fix for
    # https://github.com/gohugoio/hugo/issues/14381
    # isHTML: true
    mediaType: text/html
    path: _print
    permalinkable: false # cSpell:disable-line

# Needed for KaTeX, possibly useful for others. see
# https://github.com/google/docsy/pull/2465
mediaTypes:
  font/woff:
    suffixes: [woff]
  font/woff2:
    suffixes: [woff2]

module:
  hugoVersion:
    extended: true
    min: 0.160.1
  mounts:
    - source: assets
      target: assets
    - source: node_modules/bootstrap
      target: assets/vendor/bootstrap
    - source: node_modules/@fortawesome/fontawesome-free
      target: assets/vendor/Font-Awesome
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: node_modules/@fortawesome/fontawesome-free/webfonts
      target: static/webfonts
