{{ if partial "chrome-render.html" (dict "page" . "region" "footer") -}}
<footer class="td-footer row d-print-none">
  <div class="container-fluid">
    <div class="row mx-md-2">
      <div class="td-footer__left col-6 col-sm-4 order-sm-1">
        {{ partial "footer/left.html"  . }}
      </div>
      {{- /**/ -}}
      <div class="td-footer__right col-6 col-sm-4 order-sm-3">
        {{ partial "footer/right.html"  . }}
      </div>
      {{- /**/ -}}
      <div class="td-footer__center col-12 col-sm-4 py-2 order-sm-2">
        {{ partial "footer/center.html"  . }}
      </div>
    </div>
  </div>
</footer>
{{- else -}}
  <div class="td-chrome-placeholder" {{/**/ -}}
    data-chrome-donor="{{ (.Site.Home.OutputFormats.Get "html").RelPermalink }}" {{/**/ -}}
    data-chrome-region="footer">{{/**/ -}}
  </div>
{{- end -}}
