# Schema of `params.docsy`, the namespace Docsy reserves for theme settings.
type: map
keys:
  plugins:
    type: map # keyed by plugin name; a scalar false turns an entry off
    key:
      pattern: ^[a-z0-9_-]+$
      reservedSuffix: _docsy-shim
    entry:
      enable: { type: bool, default: true }
      defer: { type: bool, default: false } # adds `defer` to the script tag
      pageGate: { type: string, default: '' } # a .Page.Store flag; '' = none
      weight: { type: int, default: 0 } # emission order, ascending, then name
      version: { type: string, default: '' } # pin of the dependency the companion fetches; '' = none
      options: { type: map, default: {} } # reaches the module as @params
