# Map keys are:
# - type: string; trimmed, coerced, unless otherwise specified
# - optional unless listed in `required`
type: map
keys:
  plugins:
    type: map
    key: # plugin name
      type: string # lowercased
      pattern: ^[a-z0-9_-]+$
      reservedSuffix: _docsy-shim
    entry:
      type: map
      required: [enable]
      keys:
        defer: { type: bool, default: false } # coerced; adds `defer` to the script tag
        enable: { type: bool } # coerced
        options: { type: map } # reaches the module as @params
        pageGate: { type: string, default: '' } # coerced; a .Page.Store flag; '' = none
        version:
          type: string
          pattern: ^[0-9A-Za-z.+-]+$
        weight: { type: int, default: 0 } # coerced; emission order, ascending, then name
