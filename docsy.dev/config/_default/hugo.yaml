# cSpell:ignore goldmark markmap plantuml readingtime
title: Docsy
theme: [docsy/theme]
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

ignoreLogs:
  # FIXME: find a better way to encode `site` pages than having to ignore warnings.
  - warning-frontmatter-params-overrides # cSpell:disable-line

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

imaging:
  resampleFilter: CatmullRom # cSpell:disable-line

languages:
  en:
    label: English
    params:
      description: Docsy does docs
  fr: # cSpell:disable-next-line
    label: Français
    params:
      description: Docsy, c’est la doc.

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode

params:
  hugoMinVersion: &hugoMinVersion 0.160.1
  productionURL: &productionURL https://www.docsy.dev
  mainBranchPreviewURL: https://main--docsydocs.netlify.app/
  copyright:
    authors: >-
      Docsy Authors | [CC BY 4.0](https://creativecommons.org/licenses/by/4.0) |
    from_year: 2018
    to_year: present
  privacy_policy: https://policies.google.com/privacy
  github_repo: https://github.com/docsy/docsy
  github_project_repo: https://github.com/docsy/docsy
  github_subdir: docsy.dev
  example_site_url: &exampleSiteURL https://example.docsy.dev
  time_format_blog: Monday, January 02, 2006
  time_format_default: January 2, 2006
  rss_sections: [blog] # TODO: drop since this is the default
  gcs_engine_id: 011217106833237091527:la2vtv2emlw # cSpell:disable-line
  offlineSearch: false
  offlineSearchSummaryLength: 70
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false
  search:
    # algolia:
  ui:
    # showLightDarkModeMenu param values:
    showLightDarkModeMenu:
      true # default
      # false # disable
      # 'enable-only (experimental)'
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    sidebar_root_enabled: true
    feedback:
      enable: true
      yes: >-
        Glad to hear it! Please <a
        href="https://github.com/docsy/docsy/issues/new">tell us how we can
        improve</a>.
      no: >-
        Sorry to hear that. Please <a
        href="https://github.com/docsy/docsy/issues/new">tell us how we can
        improve</a>.
    readingtime:
      enable: false
  links:
    user:
      - name: GitHub Discussions
        url: https://github.com/docsy/docsy/discussions
        icon: fa-brands fa-github
        desc: Discussion and help from your fellow users
      - name: User mailing list
        url: https://groups.google.com/g/docsy-users
        icon: fa-solid fa-envelope
        desc: Sign up for Docsy announcements
      - name: Twitter
        url: https://twitter.com/docsydocs
        icon: fa-brands fa-x-twitter
        desc: Follow us on Twitter to get the latest news!
      - name: Stack Overflow
        url: https://stackoverflow.com/questions/tagged/docsy
        icon: fa-brands fa-stack-overflow
        desc: Practical questions and curated answers
    developer:
      - name: Contributing
        url: /docs/contributing/
        icon: fa-solid fa-code-fork
        desc: How to contribute
      - name: Project docs and site info
        url: /project/
        icon: fa-solid fa-book
        desc: Site design documentation and resources
      - name: Tests
        url: /tests/
        icon: fa-solid fa-flask
        desc: Test and demo pages
      - name: GitHub
        url: https://github.com/docsy/docsy
        icon: fa-brands fa-github
        desc: Development takes place here!

  plantuml:
    enable: true
    theme: default
    svg_image_url: https://www.plantuml.com/plantuml/svg/
    svg: false
  print:
    disable_toc: false
  docsy:
    plugins:
      markmap: { enable: true }
  drawio:
    enable: true

  # UG helpers: use with _param
  FA: <i class="fa-{1} fa-{2} text-{3} px-1"></i>
  FAS: <i class="fa-solid fa-{1} text-{2} px-1"></i>
  FAS_LG: <i class="fa-solid fa-{1} text-{2} fa-lg"></i>
  # Badge usage: {{% _param BADGE text color %}}
  BADGE: <span class="badge text-bg-{2} rounded-pill text-small">{1}</span>
  btn-lg: class="btn btn-lg btn-{1}" role="button"

baseURL: *productionURL

taxonomies:
  tag: tags
  category: categories

# Allow Netlify build environment variables to be accessed in templates.
#
# TODO: consider instead using a CI script to write the build information to a
# data file that Hugo could read.
security:
  funcs: # cspell:disable-line
    getenv: # cspell:disable-line
      # Netlify build env var
      - ^(BRANCH|BUILD_ID|COMMIT_REF|CONTEXT|DEPLOY_ID|NETLIFY|PULL_REQUEST|REVIEW_ID)$

module:
  hugoVersion:
    extended: true
    min: *hugoMinVersion
  mounts:
    # French landing page overrides home for fr
    - source: content/fr
      target: content
      sites: { matrix: { languages: [fr] } }
    # English content for en and as fallback for fr (other pages)
    - source: content/en
      target: content
      sites: &sites { matrix: { languages: [en, fr] } }
    # Mount the repo root *.md files for both languages
    - source: ../AGENTS.md
      target: content/project/repo/AGENTS.md
      sites: *sites
    - source: ../README.md
      target: content/project/repo/README.md
      sites: *sites
    - source: ../CHANGELOG.md
      target: content/project/repo/CHANGELOG.md
      sites: *sites
    - source: ../CONTRIBUTING.md
      target: content/project/repo/CONTRIBUTING.md
    # Root package config, for docs that cite its pins (sass-embedded-version)
    - source: ../package.json
      target: data/package.json
      sites: *sites
    # Tests
    # cSpell:ignore quang nguyen vinh therato
    - source: &bg-img content/en/background-pexels-quang-nguyen-vinh-222549-2131841.jpg
      target: content/tests/blocks-cover/height-auto/background.jpg
      sites: *sites
    - source: content/en/about/background-pexels-therato-3472764.jpg
      target: content/tests/blocks-cover/height-full/background.jpg
      sites: *sites
    - source: *bg-img
      target: content/tests/blocks-cover/height-min/background.jpg
      sites: *sites
