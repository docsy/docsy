# Hugo comes from the pinned hugo-extended npm dep, not a HUGO_VERSION env var.

# The build "base" is set to docsy.dev via the Netlify web UI.

[build]
publish = "docsy.dev/public"
command = "npm run _netlify:prepare && npm run -C docsy.dev build:preview"

[build.environment]
GO_VERSION = "1.25.5"
# Netlify clones into a dir named "repo"; the theme lives in repo's theme/ subdir.
HUGO_THEME = "repo/theme"
# Constrain Netlify's automatic npm install to resolution only: no tree
# writes, no bin linking; install:safe does the real install. Netlify offers
# no way to skip the automatic install, so if NPM_FLAGS ever stops being
# honored, it runs for real: ignore-scripts (.npmrc) still denies its
# scripts, the is:clean bracket in _netlify:prepare flags its lock rewrites,
# and install:safe's npm ci replaces node_modules wholesale, so git-invisible
# residue there never reaches the build.
NPM_FLAGS = "--dry-run --ignore-scripts"

[context.production]
command = "npm run _netlify:prepare && npm run -C docsy.dev build:production"

[context.doc-rooted.environment]
TD_BUILD_CTX = "doc-rooted"

# Preserve links from the /docs/adding-content/ → /docs/content/ slug swap.
[[redirects]]
  from = "/docs/adding-content/content"
  to = "/docs/content/adding-content"
  status = 301

[[redirects]]
  from = "/docs/adding-content/*"
  to = "/docs/content/:splat"
  status = 301

# A 301 keeps inbound fragments, which Hugo's alias page drops; force = true
# shadows the alias page at the old path.
[[redirects]]
  from = "/blog/2026/0.18.0/*"
  to = "/blog/2026/0.18.1/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fr/blog/2026/0.18.0/*"
  to = "/fr/blog/2026/0.18.1/:splat"
  status = 301
  force = true

# cSpell:ignore docsy
